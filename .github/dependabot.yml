version: 2

updates:
  # The action versions in ci.yml and release.yml. release.yml in particular runs with
  # id-token: write and trades that token for a nuget.org publishing key, so keeping the actions it
  # calls current is a supply-chain concern rather than housekeeping.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']

  # Versions live in Directory.Packages.props under central package management, which Dependabot
  # updates in place.
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    open-pull-requests-limit: 5
    ignore:
      # Both of these were proposed on the first Dependabot run and both broke the build. Neither is
      # a package whose latest version is the correct one - each is pinned to something else.
      #
      # TrxReport has to match the Microsoft.Testing.Platform major that xUnit v3 pulls in. The
      # 1.9.1 -> 2.3.3 bump restored and compiled with zero warnings, then failed at run time with
      # `TypeLoadException: could not load type IDataConsumer from Microsoft.Testing.Platform
      # 2.3.3` - xunit.v3 3.2.2 is built against 1.9.x. Zero tests ran and no TRX was written, which
      # is the failure the mutation harness reports as *inconclusive* rather than as a miss.
      - dependency-name: Microsoft.Testing.Extensions.TrxReport
        update-types: [version-update:semver-major]
      # Microsoft.Build.Framework is referenced only so it can carry ExcludeAssets="runtime"; its
      # assemblies are deliberately not used at run time, because MSBuildLocator resolves the real
      # MSBuild from the installed SDK. So the latest version buys nothing, and 17.11.48 -> 18.8.2
      # costs something: 18.x pulls in Microsoft.NET.StringTools, and Build.Locator's own guard
      # fails the build with MSBL001 until that gets the same ExcludeAssets treatment.
      - dependency-name: Microsoft.Build.Framework
        update-types: [version-update:semver-major]
    groups:
      roslyn:
        # Microsoft.CodeAnalysis.* move together and a mismatched pair fails to load a workspace at
        # runtime rather than at build time, so they are worth reviewing as one change.
        patterns:
          - Microsoft.CodeAnalysis*
          - Microsoft.Build*
      test-stack:
        patterns:
          - xunit*
          - Microsoft.NET.Test.Sdk
          - Microsoft.Testing*

# The fixture solutions under tests/Tia.Fixtures and tests/Tia.Fixtures.Tunit are deliberately
# excluded. They are test *material*, not dependencies: each one pins a specific framework and
# runner combination in order to exercise a particular filter dialect end to end, and some of the
# versions are matched pairs - a Microsoft.Testing.Extensions.TrxReport whose major version has to
# track the Microsoft.Testing.Platform that xUnit v3 pulls in. An automated bump there does not
# modernise anything; it silently changes what the dialect tests are testing, or breaks the
# mutation harness's ability to read a TRX. Update those by hand, on purpose.
