name: 'dotnet-tia'
description: 'Run only the .NET tests a change can affect, and say why on the job page.'
branding:
  icon: 'filter'
  color: 'blue'

# Needs a .NET SDK on the runner (actions/setup-dotnet), 9.0 or later, able to load the solution,
# and a full clone (actions/checkout with fetch-depth: 0). Runs on Linux, macOS and Windows runners.

inputs:
  command:
    description: '"run" (select, then run the selected tests) or "analyze" (select and report; runs nothing).'
    required: false
    default: 'run'
  base:
    description: 'What to diff against. Empty means origin/<base branch> on a pull request, and origin/<default branch> otherwise.'
    required: false
    default: ''
  default-branch:
    description: 'Branch on which the whole suite always runs. Empty means the repository default branch; "none" disables it.'
    required: false
    default: ''
  solution:
    description: 'Solution or project to analyse, relative to the workspace. Empty discovers it.'
    required: false
    default: ''
  args:
    description: 'More dotnet-tia options, split on whitespace (e.g. "--verbose --type-flow").'
    required: false
    default: ''
  configuration:
    description: 'Build and test this configuration, such as Release. Keeps the build running alongside the analysis, which passing it in test-args turns off. run only.'
    required: false
    default: ''
  results-directory:
    description: 'Keep TRX results here, a folder per test project, for a test reporter or cifail. run only.'
    required: false
    default: ''
  from-report:
    description: 'Run the selection in this report instead of analysing: one written at this commit, by this version, by another job. For shards and OS matrices that analyse once. run only.'
    required: false
    default: ''
  test-args:
    description: 'Arguments for dotnet test, passed after "--" and split on whitespace. Giving any turns off building while analysing; use configuration for the configuration.'
    required: false
    default: ''
  summary:
    description: 'Append a Markdown summary of the selection to the job page.'
    required: false
    default: 'true'
  fail-on-untested:
    description: 'Fail when a changed symbol is reached by no test.'
    required: false
    default: 'false'
  annotations:
    description: 'Annotate each changed symbol no test reaches on the pull request diff: a warning, or an error with fail-on-untested.'
    required: false
    default: 'true'
  report:
    description: 'Also write the JSON report to this file, with the tests the selection left out, for a later job (such as cifail) to recognise a selection miss.'
    required: false
    default: ''
  version:
    description: "dotnet-tia version to install. Empty installs this action's own release, so pinning the action pins the code that runs."
    required: false
    default: ''
  package-source:
    description: 'An extra NuGet source to install from, such as a directory of locally packed .nupkg files.'
    required: false
    default: ''
  comment:
    description: 'On a pull request, post the summary as a comment, and update that same comment on later pushes. Needs pull-requests: write.'
    required: false
    default: 'false'
  comment-key:
    description: 'Tells the comments of several jobs apart, such as shards (shard-1, shard-2). Jobs with the same key share one comment.'
    required: false
    default: ''
  github-token:
    description: 'The token the comment is posted with.'
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: "dotnet-tia's exit code. 0 ok, 1 a test failed (or an untested change, with fail-on-untested), 2 nothing could be concluded."
    value: ${{ steps.tia.outputs.exit-code }}
  version:
    description: 'The dotnet-tia version that ran.'
    value: ${{ steps.tia.outputs.version }}
  mode:
    description: '"selective" or "full". Empty when nothing could be analysed (exit code 2).'
    value: ${{ steps.tia.outputs.mode }}
  full-run-reason:
    description: 'Why the run is full, when it is: the first reason, on one line, cut to 300 characters.'
    value: ${{ steps.tia.outputs.full-run-reason }}
  selected-tests:
    description: 'How many tests run. Higher than impacted-tests when a project runs whole.'
    value: ${{ steps.tia.outputs.selected-tests }}
  impacted-tests:
    description: 'How many tests the change can affect.'
    value: ${{ steps.tia.outputs.impacted-tests }}
  total-tests:
    description: 'How many tests the solution has.'
    value: ${{ steps.tia.outputs.total-tests }}
  untested-changes:
    description: 'How many changed symbols no test reaches.'
    value: ${{ steps.tia.outputs.untested-changes }}
  impacted-projects:
    description: 'The test projects with a selected test, as a JSON array of names, for fromJSON in a later if: or matrix.'
    value: ${{ steps.tia.outputs.impacted-projects }}
  report:
    description: 'Path of the JSON report: the report input when given, otherwise a file under RUNNER_TEMP.'
    value: ${{ steps.tia.outputs.report }}
  results-directory:
    description: 'Where the TRX results were kept, when the results-directory input was given.'
    value: ${{ steps.tia.outputs.results-directory }}

runs:
  using: 'composite'
  steps:
    - id: tia
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_DEFAULT_BRANCH: ${{ inputs.default-branch }}
        INPUT_SOLUTION: ${{ inputs.solution }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_TEST_ARGS: ${{ inputs.test-args }}
        INPUT_CONFIGURATION: ${{ inputs.configuration }}
        INPUT_RESULTS_DIRECTORY: ${{ inputs.results-directory }}
        INPUT_FROM_REPORT: ${{ inputs.from-report }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_FAIL_ON_UNTESTED: ${{ inputs.fail-on-untested }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
        INPUT_REPORT: ${{ inputs.report }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PACKAGE_SOURCE: ${{ inputs.package-source }}
        # The release this action belongs to. Bumped with VersionPrefix in Directory.Build.props,
        # and a test fails when the two disagree, so a tag's action installs the tag's tool.
        TIA_ACTION_VERSION: '0.7.1'
        PR_BASE_REF: ${{ github.base_ref }}
        REPO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -uo pipefail
        # Exit codes are checked by hand below: dotnet-tia's own 1 and 2 are answers to report,
        # not reasons for bash to stop before writing them out.
        set +e

        case "$INPUT_COMMAND" in
          run|analyze) ;;
          *) echo "::error::dotnet-tia: unknown command '$INPUT_COMMAND' (use run or analyze)."; exit 2 ;;
        esac

        # A shallow clone cannot reach the base commit. dotnet-tia notices and runs everything,
        # which is safe and slow; saying why here saves someone reading the log to find out.
        if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = "true" ]; then
          echo "::warning::dotnet-tia: this is a shallow clone, so the whole suite will run. Check out with fetch-depth: 0."
        fi

        version="${INPUT_VERSION:-$TIA_ACTION_VERSION}"
        tool_dir="${RUNNER_TEMP:-/tmp}/dotnet-tia-$version"
        install=(tool install dotnet-tia --version "$version" --tool-path "$tool_dir")
        [ -n "$INPUT_PACKAGE_SOURCE" ] && install+=(--add-source "$INPUT_PACKAGE_SOURCE")
        if ! dotnet "${install[@]}" > "${RUNNER_TEMP:-/tmp}/dotnet-tia-install.log" 2>&1; then
          cat "${RUNNER_TEMP:-/tmp}/dotnet-tia-install.log"
          echo "::error::dotnet-tia: could not install version $version."
          exit 2
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

        base="$INPUT_BASE"
        if [ -z "$base" ]; then
          if [ -n "$PR_BASE_REF" ]; then
            base="origin/$PR_BASE_REF"
          elif [ -n "$REPO_DEFAULT_BRANCH" ]; then
            base="origin/$REPO_DEFAULT_BRANCH"
          fi
        fi

        default_branch="${INPUT_DEFAULT_BRANCH:-$REPO_DEFAULT_BRANCH}"

        tia=("$INPUT_COMMAND")
        [ -n "$base" ] && tia+=(--base "$base")
        [ -n "$default_branch" ] && [ "$default_branch" != "none" ] && tia+=(--default-branch "$default_branch")
        [ -n "$INPUT_SOLUTION" ] && tia+=(--solution "$INPUT_SOLUTION")
        # One summary, written once, for the job page and the pull request comment alike, so the
        # two never say different things.
        summary_file="${RUNNER_TEMP:-/tmp}/dotnet-tia-summary.md"
        rm -f "$summary_file"
        if [ "$INPUT_SUMMARY" = "true" ] || [ "$INPUT_COMMENT" = "true" ]; then
          tia+=(--summary "$summary_file")
        fi
        [ "$INPUT_FAIL_ON_UNTESTED" = "true" ] && tia+=(--fail-on-untested)
        [ "$INPUT_ANNOTATIONS" = "true" ] && tia+=(--annotations)
        # Always written, so the outputs below can be read from it. The report input names a
        # stable path and adds the skipped tests a later job (such as cifail) needs.
        report_file="$INPUT_REPORT"
        if [ -n "$report_file" ]; then
          tia+=(--report "$report_file" --report-skipped)
        else
          report_file="${RUNNER_TEMP:-/tmp}/dotnet-tia-report.json"
          rm -f "$report_file"
          tia+=(--report "$report_file")
        fi

        # The ${a[@]+...} form because macOS ships bash 3.2, where an empty array is unbound
        # under set -u.
        read -r -a extra <<< "$INPUT_ARGS"
        tia+=(${extra[@]+"${extra[@]}"})

        if [ -n "$INPUT_CONFIGURATION" ]; then
          if [ "$INPUT_COMMAND" != "run" ]; then
            echo "::error::dotnet-tia: configuration only applies to the run command."
            exit 2
          fi
          tia+=(--configuration "$INPUT_CONFIGURATION")
        fi

        if [ -n "$INPUT_RESULTS_DIRECTORY" ]; then
          if [ "$INPUT_COMMAND" != "run" ]; then
            echo "::error::dotnet-tia: results-directory only applies to the run command."
            exit 2
          fi
          tia+=(--results-directory "$INPUT_RESULTS_DIRECTORY")
          echo "results-directory=$INPUT_RESULTS_DIRECTORY" >> "$GITHUB_OUTPUT"
        fi

        if [ -n "$INPUT_FROM_REPORT" ]; then
          if [ "$INPUT_COMMAND" != "run" ]; then
            echo "::error::dotnet-tia: from-report only applies to the run command."
            exit 2
          fi
          tia+=(--from-report "$INPUT_FROM_REPORT")
        fi

        read -r -a test_args <<< "$INPUT_TEST_ARGS"
        if [ "${#test_args[@]}" -gt 0 ]; then
          if [ "$INPUT_COMMAND" != "run" ]; then
            echo "::error::dotnet-tia: test-args only apply to the run command."
            exit 2
          fi
          tia+=(-- ${test_args[@]+"${test_args[@]}"})
        fi

        # The tool path, not a global install: nothing the job does later sees a dotnet-tia it
        # did not ask for, and two versions in one job do not collide.
        "$tool_dir/dotnet-tia" "${tia[@]}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        # What was decided, for a later step or job to branch on without its own jq (#127). No
        # report means nothing was analysed, and the outputs stay empty rather than read as zero.
        if [ -s "$report_file" ]; then
          if command -v jq > /dev/null 2>&1; then
            {
              echo "report=$report_file"
              jq -r '
                "mode=\(.mode)",
                "full-run-reason=\((.fullRunReasons[0] // "") | gsub("[\r\n]+"; " ") | .[0:300])",
                "selected-tests=\(.selectedTests)",
                "impacted-tests=\(.impactedTests)",
                "total-tests=\(.totalTests)",
                "untested-changes=\(.untestedChanges | length)",
                "impacted-projects=\([.projects[] | select(.selectedTests > 0) | .name] | unique | tojson)"
              ' "$report_file"
            } >> "$GITHUB_OUTPUT"
          else
            echo "report=$report_file" >> "$GITHUB_OUTPUT"
            echo "::warning::dotnet-tia: jq is not on this runner, so only the report output is set."
          fi
        fi

        if [ -s "$summary_file" ]; then
          [ "$INPUT_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ] && cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          echo "summary-file=$summary_file" >> "$GITHUB_OUTPUT"
        fi

        exit "$code"

    # A separate step, so the token is in this step's environment and in no step that runs the
    # pull request's code. always(): a failing test is when the comment matters most.
    - if: always() && inputs.comment == 'true' && github.event.pull_request.number && steps.tia.outputs.summary-file
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        SUMMARY_FILE: ${{ steps.tia.outputs.summary-file }}
        COMMENT_KEY: ${{ inputs.comment-key }}
      run: |
        set -uo pipefail

        # A pull request from a fork runs with a read-only token, and a failed comment would fail
        # a job whose tests passed.
        if [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
          echo "::notice::dotnet-tia: no pull request comment from a fork's run, whose token is read-only. The job summary says the same."
          exit 0
        fi

        marker="<!-- dotnet-tia${COMMENT_KEY:+:$COMMENT_KEY} -->"
        body="${RUNNER_TEMP:-/tmp}/dotnet-tia-comment.md"
        {
          echo "$marker"
          cat "$SUMMARY_FILE"
          echo
          echo "<sub>[dotnet-tia run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) for ${GITHUB_SHA:0:9}. Updated on every push.</sub>"
        } > "$body"

        # GitHub refuses a comment over 65,536 characters. The summary caps its own lists far below
        # that, so this is a backstop, cut at a line so no character is split.
        if [ "$(wc -c < "$body")" -gt 64000 ]; then
          head -c 63000 "$body" | sed '$d' > "$body.cut"
          printf '\n\n_Cut to fit a comment. The job summary has all of it._\n' >> "$body.cut"
          mv "$body.cut" "$body"
        fi

        existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .id" 2>/dev/null | head -n 1)

        if [ -n "$existing" ]; then
          jq -Rs '{body: .}' < "$body" | gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --input - > /dev/null
        else
          jq -Rs '{body: .}' < "$body" | gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input - > /dev/null
        fi

        if [ $? -ne 0 ]; then
          echo "::warning::dotnet-tia: could not post the pull request comment. The job needs permissions: pull-requests: write."
        fi
